# Read by Android's GnssConfiguration from /vendor/etc/gps_debug.conf.
#
# The BCM4752 takes Broadcom's LTO data (GPS + GLONASS orbits for 7 days),
# from the same URL as the GC100 stock gps.conf. Android downloads it when a
# network comes up and hands it to the HAL (PSDS), and the daemon keeps it as
# /data/gps/lto2.dat, so a fix stays fast offline for a week. Without it every
# fix is a cold start of several minutes.
LONGTERM_PSDS_SERVER_1=https://gllto.glpals.com/7day/glo/v2/latest/lto2.dat
LONGTERM_PSDS_SERVER_2=https://gllto1.glpals.com/7day/glo/v2/latest/lto2.dat
LONGTERM_PSDS_SERVER_3=https://gllto2.glpals.com/7day/glo/v2/latest/lto2.dat
